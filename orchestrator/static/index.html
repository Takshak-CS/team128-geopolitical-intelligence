<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geopolitical Briefing</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #5d6470; --line: #e1e4ea;
    --accent: #2f5bea; --accent-soft: #e8eefe;
    --diverge: #b4541a; --diverge-soft: #fdf0e7;
    --agree: #1f7a4d; --agree-soft: #e7f5ee;
    --cross: #5b45c9; --cross-soft: #efecfc;
    --bad: #b42318; --warn: #a15c07;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --ink: #e8eaef; --muted: #9aa3b2; --line: #2a2f3a;
      --accent: #7b9bff; --accent-soft: #1d2640;
      --diverge: #f0a36b; --diverge-soft: #33241a;
      --agree: #6fd3a0; --agree-soft: #16291f;
      --cross: #b3a6ff; --cross-soft: #231f3b;
      --bad: #ff8a80; --warn: #ffc56b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; color: var(--muted); background: var(--panel); text-decoration: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--agree); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  .ask { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .ask form { display: flex; gap: 8px; }
  .ask input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .55; cursor: progress; }
  button.ghost { background: transparent; color: var(--accent); }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .examples button { padding: 4px 10px; font-size: 13px; background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  details.opts { margin-top: 10px; color: var(--muted); font-size: 13.5px; }
  details.opts .row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; align-items: center; }
  details.opts select, details.opts input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .status { margin: 14px 2px; color: var(--muted); font-size: 14px; min-height: 1.5em; }
  .status.err { color: var(--bad); }
  .brief { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-top: 8px; }
  .brief h2 { margin: 0 0 10px; font-size: 22px; line-height: 1.3; }
  .brief ul { margin: 0; padding-left: 20px; }
  .brief li { margin: 6px 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .chip { padding: 2px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
  h3.sec { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 28px 2px 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card.divergence { background: var(--diverge-soft); border-color: transparent; }
  .card.corroboration { background: var(--agree-soft); border-color: transparent; }
  .card.cross_agent { background: var(--cross-soft); border-color: transparent; }
  .kind { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .divergence .kind { color: var(--diverge); } .corroboration .kind { color: var(--agree); } .cross_agent .kind { color: var(--cross); }
  .card h4 { margin: 4px 0 6px; font-size: 15.5px; }
  .card p { margin: 0; }
  .conf { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .bar { flex: 0 0 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .badge { font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); }
  .caveat { margin-top: 8px; font-size: 13px; color: var(--warn); }
  details.support { margin-top: 8px; font-size: 13px; color: var(--muted); }
  details.support li { margin: 4px 0; }
  /* One full-width panel per agent, all in the same frame: header, KPI row,
     agent-specific views, claims, then calls. */
  .agents { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (max-width: 600px) { .ask form { flex-direction: column; } }
  .panel { padding: 16px 18px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .tile { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 20px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .tile .s { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px 22px; margin-top: 14px; }
  .views:empty { display: none; }
  .view { min-width: 0; }
  .view.wide { grid-column: 1 / -1; }
  .view h5 { margin: 0 0 6px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .view .note { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .barlist { display: grid; grid-template-columns: minmax(90px, 46%) 1fr auto; gap: 5px 10px; align-items: center; font-size: 13px; }
  .barlist .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barlist .track { height: 8px; border-radius: 0 4px 4px 0; background: var(--line); overflow: hidden; }
  .barlist .track i { display: block; height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--accent); }
  .barlist .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  .barlist .row { display: contents; }
  .barlist .row:hover .lbl, .barlist .row:hover .val { color: var(--ink); }
  .events-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .events-list li { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg); }
  .events-list li.mistagged { border-color: var(--bad); }
  .events-list .what { margin: 4px 0 0; }
  .events-list .why { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
  .vbadge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .vbadge.verified { color: var(--agree); } .vbadge.weak { color: var(--warn); } .vbadge.unverified { color: var(--muted); } .vbadge.mistagged { color: var(--bad); }
  .scroll { overflow-x: auto; }
  table.ctable { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.ctable th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.ctable td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.ctable td.out { color: var(--diverge); font-weight: 600; }
  svg.spark { display: block; overflow: visible; }
  svg.spark .zero { stroke: var(--line); stroke-width: 1; }
  svg.spark .line { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg.spark .end { fill: var(--accent); }
  svg.spark .hit { fill: transparent; }
  svg.spark .hit:hover { fill: var(--accent); fill-opacity: .35; }
  .claims { padding-left: 18px; margin: 14px 0 0; }
  .claims li { margin: 8px 0; }
  .claims li small { display: block; color: var(--muted); }
  .claims .caveat { margin-top: 2px; }
  .agent-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .agent-head h4 { margin: 0; font-size: 16px; }
  .agent-head a { font-size: 13px; color: var(--accent); }
  .agent ol { padding-left: 18px; margin: 10px 0 0; }
  .agent li { margin: 8px 0; }
  .agent li small { display: block; color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 480px; overflow: auto; }
  table.calls { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  table.calls td { padding: 3px 6px; border-top: 1px solid var(--line); font-family: var(--mono); }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Team 128 <span>· Geopolitical Intelligence · orchestrated briefing</span></h1>
  <div class="pills" id="agentPills"><span class="pill">checking agents…</span></div>
</header>
<main>
  <section class="ask">
    <form id="askForm">
      <input type="text" id="question" autocomplete="off" placeholder="Ask about a country, a pair of countries, a disruption, or a trend…" value="How exposed is India right now?">
      <button type="submit" id="askBtn">Ask</button>
    </form>
    <div class="examples" id="examples"></div>
    <details class="opts">
      <summary>Options</summary>
      <div class="row">
        <span>Agents:</span>
        <label><input type="checkbox" name="agent" value="soft_power" checked> Soft Power</label>
        <label><input type="checkbox" name="agent" value="policy_stance" checked> Policy Stance</label>
        <label><input type="checkbox" name="agent" value="trade_intelligence" checked> Trade</label>
        <label><input type="checkbox" name="agent" value="event_summarization" checked> Events</label>
      </div>
      <div class="row">
        <label>Year <input type="number" id="year" min="1989" max="2030" placeholder="latest" style="width:90px"></label>
        <label>Sector <select id="sector"><option value="">auto</option><option>all</option><option>energy</option><option>agriculture</option><option>electronics</option></select></label>
        <span class="muted">Options left blank are read from the question.</span>
      </div>
    </details>
  </section>

  <div class="status" id="status"></div>

  <div id="result" class="hidden">
    <section class="brief">
      <h2 id="headline"></h2>
      <ul id="summary"></ul>
      <div class="meta" id="meta"></div>
    </section>

    <div id="findingSections"></div>

    <h3 class="sec">By agent</h3>
    <div class="agents" id="agents"></div>

    <h3 class="sec">How the question was handled</h3>
    <div class="card" id="plan"></div>

    <h3 class="sec">Raw response</h3>
    <details class="card"><summary>Show JSON</summary><pre id="raw"></pre></details>
  </div>
</main>

<script>
const LABELS = { soft_power: "Soft Power", policy_stance: "Policy Stance", trade_intelligence: "Trade", event_summarization: "Events" };
const KIND_LABEL = { divergence: "Divergence", corroboration: "Corroboration", cross_agent: "Cross-agent" };
const EXAMPLES = [
  "How exposed is India right now?",
  "India and China relations",
  "What if China stops exporting electronics?",
  "Which countries are most dependent on trade?",
  "Forecast Brazil exports to 2030",
  "What happened in Iran yesterday?",
  "Which bloc is Vietnam in?",
];

const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child != null) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  return node;
}
// Agent text can carry light markdown (**bold**); render it as plain text.
const plain = (text) => String(text ?? "").replace(/\*\*/g, "");

function confidence(value) {
  const pct = Math.round((value || 0) * 100);
  const bar = el("span", { class: "bar" }, el("i", { style: `width:${pct}%` }));
  return el("div", { class: "conf" }, bar, `confidence ${(value || 0).toFixed(2)}`);
}

function badges(labels) {
  return el("div", { class: "badges" }, (labels || []).map((label) => el("span", { class: "badge", text: label })));
}

function findingCard(finding) {
  const card = el("article", { class: `card ${finding.kind}` },
    el("div", { class: "kind", text: KIND_LABEL[finding.kind] || finding.kind }),
    el("h4", { text: plain(finding.title) }),
    el("p", { text: plain(finding.claim) }),
  );
  const row = confidence(finding.confidence);
  row.append(badges(finding.agent_labels));
  card.append(row);
  if (finding.caveat) card.append(el("div", { class: "caveat", text: `Caveat: ${finding.caveat}` }));
  if (finding.supporting?.length) {
    const list = el("ul", {}, finding.supporting.map((s) =>
      el("li", {}, el("strong", { text: `${s.agent_label}: ` }), plain(s.claim), el("br"), el("span", { text: `conf ${s.confidence} · ${s.reason || ""}` }))));
    card.append(el("details", { class: "support" }, el("summary", { text: "What each agent said" }), list));
  }
  return card;
}

// ---------------------------------------------------------------- agent panels
// Every agent gets the same frame: header, KPI tiles, agent-specific views,
// every claim with its confidence and caveat, then the raw calls. The views
// read the evidence each claim already carries; nothing here computes new facts.
const isNum = (v) => typeof v === "number" && isFinite(v);
const fmt = {
  pct: (v, d = 0) => (isNum(v) ? `${(v * 100).toFixed(d)}%` : null),
  signed: (v, d = 2) => (isNum(v) ? `${v >= 0 ? "+" : ""}${v.toFixed(d)}` : null),
  int: (v) => (isNum(v) ? v.toLocaleString() : null),
  day: (d) => (typeof d === "string" && d.length === 8 ? `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}` : null),
};
const firstOf = (insights, facet) => insights.find((i) => i.facet === facet);
const byFacet = (insights, facet) => insights.filter((i) => i.facet === facet);

function tile(label, value, sub) {
  if (value == null || value === "") return null;
  return el("div", { class: "tile" }, el("div", { class: "k", text: label }), el("div", { class: "v", text: String(value) }), sub ? el("div", { class: "s", text: sub }) : null);
}

function view(title, body, { wide = false, note = null } = {}) {
  if (!body) return null;
  return el("div", { class: `view${wide ? " wide" : ""}` }, el("h5", { text: title }), body, note ? el("p", { class: "note", text: note }) : null);
}

// One series, one hue: bars grow from a shared baseline; the value is text.
function barList(rows, { max } = {}) {
  rows = (rows || []).filter((r) => isNum(r.value));
  if (!rows.length) return null;
  const top = max ?? Math.max(...rows.map((r) => Math.abs(r.value)), 1e-9);
  return el("div", { class: "barlist", role: "list" }, rows.map((r) => {
    const pct = Math.max(0, Math.min(100, (Math.abs(r.value) / top) * 100));
    const tip = r.title || `${r.label}: ${r.display}`;
    return el("div", { class: "row", role: "listitem" },
      el("span", { class: "lbl", text: r.label, title: tip }),
      el("span", { class: "track", title: tip }, el("i", { style: `width:${pct}%` })),
      el("span", { class: "val", text: r.display, title: tip }));
  }));
}

const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs = {}, ...children) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  for (const child of children) if (child) node.append(child);
  return node;
}

// GGE alignment series on its fixed -1..+1 scale, zero line for reference.
function sparkline(series, { lo = -1, hi = 1, w = 120, h = 28 } = {}) {
  const pts = (series || []).filter((p) => isNum(p.score));
  if (pts.length < 2) return null;
  const x = (i) => (i / (pts.length - 1)) * w;
  const y = (v) => h - ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * h;
  const last = pts[pts.length - 1];
  const root = svg("svg", { class: "spark", width: w, height: h, viewBox: `0 0 ${w} ${h}`, role: "img", "aria-label": `GGE alignment ${pts[0].year} to ${last.year}, latest ${fmt.signed(last.score, 3)}` },
    svg("line", { class: "zero", x1: 0, x2: w, y1: y(0), y2: y(0) }),
    svg("path", { class: "line", d: pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join("") }),
    svg("circle", { class: "end", cx: x(pts.length - 1), cy: y(last.score), r: 4 }));
  pts.forEach((p, i) => {
    const title = svg("title");
    title.textContent = `${p.year}: ${fmt.signed(p.score, 3)}`;
    root.append(svg("circle", { class: "hit", cx: x(i), cy: y(p.score), r: 5 }, title));
  });
  return root;
}

function sourceLink(url) {
  if (typeof url !== "string" || !/^https?:\/\//.test(url)) return null;
  let host = url;
  try { host = new URL(url).hostname.replace(/^www\./, ""); } catch { /* keep the raw url */ }
  return el("a", { href: url, target: "_blank", rel: "noopener noreferrer", class: "muted", text: `${host} ↗` });
}

const VERIFY = {
  verified: ["✓", "Verified in article"],
  weak: ["◐", "Weakly supported"],
  unverified: ["?", "Unverified"],
  mistagged: ["✕", "Likely mis-tagged"],
};
function verifyBadge(v) {
  const status = VERIFY[v?.status] ? v.status : "unverified";
  const [icon, label] = VERIFY[status];
  return el("span", { class: `vbadge ${status}` }, el("span", { "aria-hidden": "true", text: icon }), label + (v?.method === "url_only" ? " (URL check)" : ""));
}

const VIEWS = {
  event_summarization(ins) {
    const act = firstOf(ins, "event_activity")?.evidence || {};
    const kpis = [
      tile("Events", fmt.int(act.total_events), fmt.day(act.date) && `GDELT, ${fmt.day(act.date)}`),
      tile("Mean Goldstein", fmt.signed(act.avg_goldstein), act.tone),
      tile("Conflict / cooperation", fmt.pct(act.conflict_share) && `${fmt.pct(act.conflict_share)} / ${fmt.pct(act.cooperation_share)}`, "share of event types"),
      tile("Initiated", isNum(act.initiator_pct) ? `${act.initiator_pct}%` : null, "of the day's events"),
    ];
    const views = [];
    const themes = firstOf(ins, "event_themes");
    if (themes) {
      const q = themes.evidence.cluster_quality;
      const note = q && isNum(q.silhouette)
        ? `Cluster quality: ${q.silhouette.toFixed(2)} · ${q.label} (shuffled baseline ${fmt.signed(q.silhouette_null)}, seed stability ${isNum(q.stability_ari) ? q.stability_ari.toFixed(2) : "n/a"})`
        : "Cluster quality: not available";
      views.push(view("Themes", barList((themes.evidence.themes || []).map((t) => ({ label: t.label, value: t.share, display: `${fmt.pct(t.share)} · ${t.count}` })), { max: 1 }), { note }));
    }
    const split = firstOf(ins, "event_domestic_split");
    if (split) {
      const d = split.evidence.domestic || {}, i = split.evidence.international || {};
      views.push(view("Domestic vs international", barList([
        { label: "Domestic", value: d.total, display: `${d.total} · Goldstein ${fmt.signed(d.avg_goldstein)}` },
        { label: "International", value: i.total, display: `${i.total} · Goldstein ${fmt.signed(i.avg_goldstein)}` },
      ]), { note: split.caveat }));
    }
    const heads = byFacet(ins, "event_headline");
    if (heads.length) {
      views.push(view("Top events, checked against their source", el("ol", { class: "events-list" }, heads.map((h) => {
        const e = h.evidence || {}, v = e.verification || {};
        return el("li", { class: v.status === "mistagged" ? "mistagged" : "" },
          el("div", { class: "agent-head" }, verifyBadge(v), el("span", { class: "muted", text: `#${e.rank} · ${e.event_type} · Goldstein ${fmt.signed(e.goldstein, 1)} · ${e.num_articles ?? "?"} articles` })),
          el("p", { class: "what", text: plain(h.claim) }),
          v.verdict ? el("p", { class: "why", text: v.verdict }) : null,
          v.snippet ? el("p", { class: "why", text: `“${v.snippet}”` }) : null,
          sourceLink(e.url));
      })), { wide: true }));
    }
    const partners = firstOf(ins, "event_partners")?.evidence?.partners || [];
    const baselines = Object.fromEntries(byFacet(ins, "relationship_baseline").map((b) => [(b.evidence.pair || [])[1], b.evidence]));
    if (partners.length) {
      const rows = partners.map((p) => {
        const b = baselines[p.iso3];
        const g = p.avg_goldstein, avg = b?.avg_10yr;
        // Same thresholds as fusion's "out of character" check.
        const out = isNum(avg) && ((avg >= 0.1 && g <= -1) || (avg <= -0.1 && g >= 1));
        return el("tr", {},
          el("td", { text: p.iso3 }),
          el("td", { text: String(p.count) }),
          el("td", { class: out ? "out" : "", text: `${fmt.signed(g, 1)}${out ? (g < 0 ? " ↓ out of character" : " ↑ warmer than history") : ""}` }),
          el("td", { text: b?.baseline_label || "—" }),
          el("td", { text: fmt.signed(avg, 3) || "—" }),
          el("td", {}, b ? sparkline(b.series) : el("span", { class: "muted", text: "not fetched" })));
      });
      views.push(view("Counterparts: today vs 1990-2024", el("div", { class: "scroll" }, el("table", { class: "ctable" },
        el("tr", {}, ["Partner", "Events today", "Goldstein today", "GGE baseline", "10-yr avg", "GGE 2000-2024"].map((t) => el("th", { text: t }))),
        rows)), { wide: true, note: "GGE baselines are fetched for the three most active counterparts." }));
    }
    return { kpis, views };
  },

  trade_intelligence(ins) {
    const risk = firstOf(ins, "trade_exposure")?.evidence, bloc = firstOf(ins, "trade_alignment")?.evidence, lev = firstOf(ins, "trade_dependence")?.evidence;
    const kpis = [
      tile("Trade risk rank", risk && `#${risk.rank} of ${risk.countries_ranked}`, risk && isNum(risk.trade_concentration) ? `partner concentration ${risk.trade_concentration.toFixed(2)}` : null),
      tile("Trading bloc", bloc && `${bloc.bloc_name}-anchored`, bloc && `${bloc.bloc_size} members · ${fmt.pct(bloc.internal_trade_share)} internal trade`),
      tile("Most critical partner", lev?.most_critical_partner, lev && `${fmt.pct(lev.critical_partner_dependence, 1)} of its trade`),
      tile("Net leverage", lev && fmt.signed(lev.net_leverage), lev && `dominates ${lev.partners_dominated} · depends on ${lev.partners_dependent_on}`),
    ];
    const views = [];
    if (lev) {
      views.push(view("Most dependent on (share of its trade)", barList((lev.vulnerable_to || []).map((r) => ({ label: r.leverage_holder, value: r.exposed_dependence, display: fmt.pct(r.exposed_dependence, 1) })))));
      views.push(view("Holds leverage over (their dependence)", barList((lev.holds_leverage_over || []).map((r) => ({ label: r.exposed_country, value: r.exposed_dependence, display: fmt.pct(r.exposed_dependence, 1) })))));
    }
    const fragile = byFacet(ins, "supply_fragility");
    if (fragile.length) {
      views.push(view("Sector fragility (0-1)", barList(fragile.map((f) => ({ label: f.evidence.sector, value: f.evidence.fragility_score, display: `${f.evidence.fragility_score.toFixed(2)} · top ${f.evidence.top_supplier || "?"} ${fmt.pct(f.evidence.top_supplier_share) || ""}` })), { max: 1 })));
    }
    const shock = byFacet(ins, "shock_impact").filter((s) => isNum(s.evidence?.impact_score));
    if (shock.length) {
      views.push(view("Shock impact by economy", barList(shock.map((s) => ({ label: s.entity_name, value: s.evidence.impact_score, display: s.evidence.impact_score.toFixed(3) })))));
    }
    return { kpis, views };
  },

  soft_power(ins) {
    const inf = firstOf(ins, "influence")?.evidence, trend = firstOf(ins, "influence_trend")?.evidence;
    const outlook = (firstOf(ins, "influence_outlook")?.evidence?.forecast || []).slice(-1)[0];
    const kpis = [
      tile("Soft Power score", inf && isNum(inf.score) ? `${inf.score.toFixed(1)} / 100` : null, inf && `#${inf.rank} of ${inf.of} · ${inf.year}`),
      tile("Change", trend && fmt.signed(trend.delta, 1), trend && `${trend.from_year}-${trend.to_year}, ${trend.direction}`),
      tile("Forecast", outlook && isNum(outlook.score) ? outlook.score.toFixed(1) : null, outlook && `${outlook.year} · interval ${outlook.lo?.toFixed(1)}-${outlook.hi?.toFixed(1)}`),
    ];
    const drivers = firstOf(ins, "influence_drivers")?.evidence?.drivers || [];
    const peers = firstOf(ins, "influence_peers")?.evidence?.peers || [];
    return {
      kpis,
      views: [
        view("Top drivers (mean |SHAP|)", barList(drivers.slice(0, 6).map((d) => ({ label: d.feature, value: d.shap, display: d.shap.toFixed(2) })))),
        view("Closest profiles (similarity)", barList(peers.slice(0, 6).map((p) => ({ label: p.iso3, value: p.similarity, display: p.similarity.toFixed(2) })), { max: 1 })),
      ],
    };
  },

  policy_stance(ins) {
    const al = firstOf(ins, "diplomatic_alignment")?.evidence, conflict = firstOf(ins, "conflict_exposure")?.evidence;
    const kpis = [
      tile("UN bloc", al?.bloc, al?.provenance && `provenance: ${al.provenance}`),
      tile("Conflict records", conflict && fmt.int(conflict.conflict_records), conflict && `${fmt.int(conflict.deaths)} deaths`),
      tile("Deaths, last 5 years", conflict && fmt.int(conflict.recent_deaths_5y)),
    ];
    const partners = firstOf(ins, "diplomatic_partners")?.evidence?.partners || [];
    return {
      kpis,
      views: [view("Closest UN voting partners (agreement)", barList(partners.slice(0, 6).map((p) => ({ label: p.name, value: p.un_agree_rate, display: fmt.pct(p.un_agree_rate) })), { max: 1 }))],
    };
  },
};

function claimList(insights) {
  return el("ol", { class: "claims" }, insights.map((item) => {
    const row = el("li", {}, plain(item.claim));
    const link = sourceLink(item.evidence?.url);
    if (link) row.append(" ", link);
    row.append(el("small", { text: `${item.facet || ""} · conf ${Number(item.confidence).toFixed(2)} · ${item.reason || ""}` }));
    if (item.caveat) row.append(el("div", { class: "caveat", text: `Caveat: ${item.caveat}` }));
    return row;
  }));
}

function renderAgents(agents, order) {
  const box = $("agents");
  box.replaceChildren();
  for (const name of order) {
    const result = agents[name];
    if (!result) continue;
    const ok = result.status === "ok" || result.status === "partial";
    const head = el("div", { class: "agent-head" },
      el("h4", { text: LABELS[name] || name }),
      el("span", { class: "muted", text: `${result.status} · ${Math.round(result.latency_ms)} ms · ${result.insight_count} insights` }),
    );
    if (result.dashboard_url) head.append(el("a", { href: result.dashboard_url, target: "_blank", rel: "noopener", text: "Open module dashboard ↗" }));
    const card = el("article", { class: "card agent panel" }, head);
    if (result.error) card.append(el("p", { class: "caveat", text: result.error }));
    for (const note of result.notes || []) card.append(el("p", { class: "muted", text: note }));
    const insights = result.envelope?.insights || [];
    if (ok && insights.length) {
      let parts = { kpis: [], views: [] };
      try {
        if (VIEWS[name]) parts = VIEWS[name](insights);
      } catch (err) {
        // An unexpected response shape costs this panel its views, not the briefing.
        console.warn(`views for ${name} failed`, err);
      }
      const kpis = (parts.kpis || []).filter(Boolean), views = (parts.views || []).filter(Boolean);
      if (kpis.length) card.append(el("div", { class: "kpis" }, kpis));
      if (views.length) card.append(el("div", { class: "views" }, views));
      card.append(claimList(insights));
    }
    const meta = result.envelope?.metadata;
    const calls = el("table", { class: "calls" }, (result.calls || []).map((c) =>
      el("tr", {}, el("td", { text: c.method }), el("td", { text: c.path }), el("td", { text: c.status ?? "—" }), el("td", { text: `${c.ms} ms` }))));
    card.append(el("details", { class: "support" }, el("summary", { text: `Calls and metadata (${(result.calls || []).length} calls)` }),
      calls, meta ? el("pre", { text: JSON.stringify(meta, null, 2) }) : null));
    box.append(card);
  }
}

function renderPlan(data) {
  const plan = data.plan;
  const box = $("plan");
  box.replaceChildren(
    el("p", {}, el("strong", { text: "Intent: " }), plan.intent,
      el("strong", { text: "  ·  Countries: " }), plan.entities.length ? plan.entities.map((e) => `${e.name} (${e.iso3}, from "${e.matched}")`).join(", ") : "none",
      el("strong", { text: "  ·  Time: " }), plan.time.mode === "year" ? plan.time.year : plan.time.mode === "date" ? plan.time.date : `latest (aligned ${data.time_alignment.aligned_year ?? "n/a"})`,
      el("strong", { text: "  ·  Sector: " }), plan.sector),
    el("ul", {}, plan.agents.map((agent) => el("li", {}, el("strong", { text: `${LABELS[agent]}: ` }), plan.agent_reasons[agent]))),
    ...(plan.notes || []).map((note) => el("p", { class: "muted", text: note })),
    ...(data.time_alignment.warnings || []).map((note) => el("p", { class: "muted", text: note })),
  );
}

function render(data) {
  const brief = data.briefing;
  $("headline").textContent = plain(brief.headline);
  $("summary").replaceChildren(...brief.summary.map((line) => el("li", { text: plain(line) })));
  const stats = data.fused.stats;
  $("meta").replaceChildren(
    el("span", { class: "chip", text: brief.coverage }),
    el("span", { class: "chip", text: `${stats.insights_after_dedupe} insights (${stats.duplicates_removed} duplicates removed)` }),
    el("span", { class: "chip", text: `${stats.divergences} divergences · ${stats.corroborations} corroborations` }),
    el("span", { class: "chip", text: `${Math.round(data.latency_ms)} ms end to end` }),
  );

  const holder = $("findingSections");
  holder.replaceChildren();
  for (const section of brief.sections.filter((s) => s.kind !== "agent")) {
    holder.append(el("h3", { class: "sec", text: section.title }), el("div", { class: "cards" }, section.findings.map(findingCard)));
  }
  if (brief.caveats?.length) {
    holder.append(el("h3", { class: "sec", text: "Caveats" }), el("div", { class: "card" }, el("ul", {}, brief.caveats.map((c) => el("li", { text: c })))));
  }
  renderAgents(data.agents, data.plan.agents);
  renderPlan(data);
  $("raw").textContent = JSON.stringify(data, null, 2);
  $("result").classList.remove("hidden");
}

async function ask(question) {
  const agents = [...document.querySelectorAll("input[name=agent]:checked")].map((box) => box.value);
  const body = { question };
  if (agents.length && agents.length < 4) body.agents = agents;
  if ($("year").value) body.year = Number($("year").value);
  if ($("sector").value) body.sector = $("sector").value;

  $("askBtn").disabled = true;
  const status = $("status");
  status.className = "status";
  status.textContent = "Fanning out to the agents… (Events may take up to a minute the first time it sees a date)";
  const started = performance.now();
  try {
    const response = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await response.json();
    if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
    render(data);
    status.textContent = `Answered in ${((performance.now() - started) / 1000).toFixed(1)} s.`;
  } catch (error) {
    status.className = "status err";
    status.textContent = `Request failed: ${error.message}`;
  } finally {
    $("askBtn").disabled = false;
  }
}

async function refreshAgents() {
  const pills = $("agentPills");
  try {
    const data = await (await fetch("/agents")).json();
    pills.replaceChildren(...Object.entries(data).map(([name, info]) => {
      const cls = info.status === "ok" ? "ok" : info.status === "not_ready" ? "warn" : "bad";
      const pill = el(info.dashboard_url ? "a" : "span", { class: "pill", title: `${info.base_url || ""} · ${info.status}` }, el("span", { class: `dot ${cls}` }), LABELS[name] || name);
      if (info.dashboard_url) { pill.href = info.dashboard_url; pill.target = "_blank"; pill.rel = "noopener"; }
      return pill;
    }));
  } catch {
    pills.replaceChildren(el("span", { class: "pill" }, el("span", { class: "dot bad" }), "orchestrator unreachable"));
  }
}

$("examples").replaceChildren(...EXAMPLES.map((text) => {
  const button = el("button", { type: "button", text });
  button.addEventListener("click", () => { $("question").value = text; ask(text); });
  return button;
}));
$("askForm").addEventListener("submit", (event) => {
  event.preventDefault();
  const question = $("question").value.trim();
  if (question.length >= 2) ask(question);
});
refreshAgents();
setInterval(refreshAgents, 30000);
</script>
